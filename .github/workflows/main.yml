name: Extract ZIP to Main Directory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and Replace All Files
        shell: bash
        run: |
          set -euo pipefail

          # Find the ZIP file in the repository root
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found, nothing to extract."
            exit 0
          fi

          # Extract ZIP contents to a temporary directory
          rm -rf extract_tmp
          mkdir extract_tmp

          unzip -q "$ZIP_FILE" -d extract_tmp

          # Remove macOS metadata
          find extract_tmp -name "__MACOSX" -type d -prune -exec rm -rf {} +
          find extract_tmp -name ".DS_Store" -type f -delete

          # Flatten a single enclosing directory, if present
          shopt -s dotglob nullglob
          items=(extract_tmp/*)
          shopt -u dotglob nullglob

          SRC="extract_tmp"

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            SRC="${items[0]}"
          fi

          # Stage extracted files separately before deleting old files
          mkdir replacement_tmp
          find "$SRC" -mindepth 1 -maxdepth 1 \
            -exec cp -a -t replacement_tmp/ {} +

          # Remove old repository contents, including hidden files
          # Preserve Git metadata and the temporary replacement files
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'extract_tmp' \
            ! -name 'replacement_tmp' \
            -exec rm -rf -- {} +

          # Copy all new files, including hidden files, to repository root
          cp -a replacement_tmp/. .

          # Remove temporary files
          rm -rf extract_tmp replacement_tmp

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace repository files with ZIP contents"
            git push origin HEAD:main
          fi
