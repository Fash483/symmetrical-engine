name: Extract ZIP to Main Directory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required to allow pushing code back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear Workspace (Keeping .github and ZIPs)
        shell: bash
        run: |
          shopt -s dotglob nullglob
          for f in *; do
            [ "$f" = "." ] || [ "$f" = ".." ] && continue
            [ "$f" = ".git" ] && continue
            [ "$f" = ".github" ] && continue
            [[ "$f" == *.zip ]] && continue
            
            echo "Removing old file/folder: $f"
            rm -rf "$f"
          done
          shopt -u dotglob nullglob

      - name: Extract and Flatten ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found, nothing to extract."
            exit 0
          fi

          rm -rf extract_tmp target_dir
          mkdir extract_tmp target_dir

          unzip -q "$ZIP_FILE" -d extract_tmp
          rm -f "$ZIP_FILE"

          find extract_tmp -name "__MACOSX" -exec rm -rf {} + 2>/dev/null || true
          find extract_tmp -name ".DS_Store" -exec rm -f {} + 2>/dev/null || true

          shopt -s dotglob nullglob
          items=(extract_tmp/*)
          shopt -u dotglob nullglob

          if [ ${#items[@]} -eq 1 ] && [ -d "${items}" ]; then
            SRC="${items}"
          else
            SRC="extract_tmp"
          fi

          find "$SRC" -mindepth 1 -maxdepth 1 -exec mv -t target_dir/ {} +
          rm -rf extract_tmp

          find target_dir -mindepth 1 -maxdepth 1 -exec cp -rp -t ./ {} +
          rm -rf target_dir

      - name: Save Files to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Only commit if there are actually changes to prevent workflow crashes
          if git diff --staged --quiet; then
            echo "No new files to save."
          else
            git commit -m "Clear directory and update with extracted project files"
            git push origin main
          fi
